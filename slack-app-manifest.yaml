# ISAIC — Slack app manifest (Socket Mode).
# Create the app: https://api.slack.com/apps → "Create New App" → "From a manifest"
# → pick your workspace → paste this YAML. Then:
#   1. OAuth & Permissions → Install to Workspace → copy the Bot User OAuth Token (xoxb-) → SLACK_BOT_TOKEN
#   2. Basic Information → App-Level Tokens → "Generate Token and Scopes" with the
#      connections:write scope → copy the App-Level Token (xapp-) → SLACK_APP_TOKEN
#   3. Invite the bot to each channel in config.json: /invite @ISAIC
display_information:
  name: ISAIC
  description: International System of AI Coopertition — a multi-model assistant (Claude + Gemini + Deepseek + open-weight heads)
  background_color: "#1a1a2e"
features:
  bot_user:
    display_name: ISAIC
    always_online: true
  slash_commands:
    - command: /isaic
      description: Show ISAIC help and available commands
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - chat:write
      - reactions:read
      - files:read
      - files:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
